name: Android battery sender APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-battery-sender/**'
      - '.github/workflows/android-battery-sender.yml'
  pull_request:
    paths:
      - 'android-battery-sender/**'
      - '.github/workflows/android-battery-sender.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-battery-sender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test, lint and build debug APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            gradle testDebugUnitTest lintDebug assembleDebug && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle download/build failed; retrying in $((attempt * 30)) seconds..."
              sleep $((attempt * 30))
            fi
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: BatteryOverlaySender-debug
          path: android-battery-sender/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
