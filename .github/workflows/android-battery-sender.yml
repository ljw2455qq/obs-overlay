name: Android battery sender APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-battery-sender/**'
      - '.github/workflows/android-battery-sender.yml'
  pull_request:
    paths:
      - 'android-battery-sender/**'
      - '.github/workflows/android-battery-sender.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-battery-sender
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
      - name: Test, lint and build debug APK
        shell: bash
        run: |
          for attempt in 1 2 3; do
            set +e
            gradle testDebugUnitTest lintDebug assembleDebug 2>&1 | tee gradle-build.log
            status=${PIPESTATUS[0]}
            set -e
            [ "$status" -eq 0 ] && exit 0
            if [ "$attempt" -ge 3 ] || ! grep -q 'status code 429' gradle-build.log; then
              exit "$status"
            fi
            echo "Dependency download was rate-limited; retrying in $((attempt * 30)) seconds..."
            sleep $((attempt * 30))
          done
          exit 1
      - uses: actions/upload-artifact@v6
        with:
          name: BatteryOverlaySender-debug
          path: android-battery-sender/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
